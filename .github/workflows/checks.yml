name: Checks

# Fast, game-free checks on every push: tests that need no ROM and no signing.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-controller:
    name: Phone as controller (format, players, loopback)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Message format, player slots and input mixing
        run: |
          swiftc --version
          swiftc -O Sources/RemoteControllerProtocol.swift Tests/RemoteControllerProtocolTests.swift \
            -parse-as-library -o "$RUNNER_TEMP/remote-controller-tests"
          "$RUNNER_TEMP/remote-controller-tests"
      - name: Apple TV save mirror survives a cleared Caches folder
        run: |
          swiftc -O Sources/GoldenPadSaveMirror.swift Tests/GoldenPadSaveMirrorTests.swift             -parse-as-library -o "$RUNNER_TEMP/save-mirror-tests"
          "$RUNNER_TEMP/save-mirror-tests"
      - name: Phone-to-TV loopback over real sockets
        run: |
          swiftc -O Sources/RemoteControllerProtocol.swift Sources/RemoteControllerTransport.swift \
            Tests/RemoteControllerLoopbackTest.swift -parse-as-library -o "$RUNNER_TEMP/remote-controller-loopback"
          "$RUNNER_TEMP/remote-controller-loopback"
          # (the scripted iPhone used by the Apple TV simulator test must build too)
          swiftc -O Sources/RemoteControllerProtocol.swift Sources/RemoteControllerTransport.swift             Tests/RemoteControllerPhoneScript.swift -parse-as-library -o "$RUNNER_TEMP/remote-controller-phone"

  apple-compile:
    name: App Swift compiles for iPhone and Apple TV; Apple TV icons compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pick the newest Xcode 26
        run: |
          xcode=$(for x in /Applications/Xcode_26*.app; do [ -L "$x" ] || echo "$x"; done | sort -V | tail -n 1)
          xcode=$(cd "$xcode" && pwd -P)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"
      - name: Type-check the app's Swift (no game code needed)
        run: |
          files="Sources/GoldenPadDiagnostics.swift Sources/GoldenPadIssueReport.swift
            Sources/RecompPrototypeApp.swift Sources/RecompPrototypeAudio.swift Sources/RecompControlMapping.swift
            Sources/RecompPrototypeInput.swift Sources/LANNetplayCoordinator.swift Sources/LANNetplayProtocol.swift
            Sources/RemoteControllerProtocol.swift Sources/RemoteControllerSession.swift
            Sources/RemoteControllerTransport.swift Sources/RemoteControllerViews.swift
            Sources/GoldenPadSaveMirror.swift Sources/GoldenPadCrashReport.swift
            Sources/RecompPrototypeMetalCanvas.swift Sources/RecompPrototypeROMStore.swift
            Sources/RecompTouchFireState.swift Sources/RecompPrototypeTouchLayout.swift"
          status=0
          for target in iphoneos:arm64-apple-ios17.0 appletvos:arm64-apple-tvos17.0; do
            sdk=${target%%:*}; triple=${target#*:}
            echo "== $sdk"
            xcrun --sdk "$sdk" swiftc -typecheck -swift-version 5 -target "$triple" $files || status=1
          done
          exit $status
      - name: Crash recorder compiles everywhere and records a crash
        run: |
          src=Support/RecompPrototype/goldenpad_crash_capture.cpp
          for target in appletvos:arm64-apple-tvos17.0 iphoneos:arm64-apple-ios17.0 macosx:arm64-apple-macos14.0; do
            sdk=${target%%:*}; triple=${target#*:}
            echo "== $sdk"
            xcrun --sdk "$sdk" clang++ -std=c++20 -Wall -Wextra -Werror -target "$triple" -c "$src" -o "$RUNNER_TEMP/crash-$sdk.o"
          done
          xcrun clang++ -std=c++20 -g "$src" Tests/GoldenPadCrashCaptureTest.cpp -o "$RUNNER_TEMP/crash-test"
          logs="$RUNNER_TEMP/crash-logs"; rm -rf "$logs"
          if "$RUNNER_TEMP/crash-test" "$logs"; then echo "::error::the test program did not crash"; exit 1; fi
          echo "--- crash-latest.txt"; cat "$logs/crash-latest.txt"
          echo "--- stdio-latest.log"; cat "$logs/stdio-latest.log"
          grep -q "crash: SIGSEGV" "$logs/crash-latest.txt"
          grep -q "last stage: crash test" "$logs/crash-latest.txt"
          grep -q "backtrace:" "$logs/crash-latest.txt"
          grep -q "goldenpad_crash_test" "$logs/crash-latest.txt"
          grep -q "crash capture ready" "$logs/stdio-latest.log"
          grep -q "printed to stdout before the crash" "$logs/stdio-latest.log"
          grep -q "stage: renderer: initializing (test)" "$logs/stdio-latest.log"
          # a second run rotates the first crash to crash-previous.txt
          "$RUNNER_TEMP/crash-test" "$logs" || true
          grep -q "crash: SIGSEGV" "$logs/crash-previous.txt"
          echo "PASS: crash recorder"
      - name: RT64 data folder fix applies to the pinned render context
        run: |
          git submodule update --init --depth 1 vendor/goldeneye
          src=vendor/goldeneye/src/main/rt64_render_context.cpp
          out="$RUNNER_TEMP/goldenpad_rt64_render_context.cpp"
          cmake -DINPUT="$PWD/$src" -DOUTPUT="$out" -P cmake/GoldenPadRT64RenderContext.cmake
          echo "--- generated changes"; diff <(sed 1,11d "$out") "$src" || true
          grep -q '#define GOLDENPAD_RT64_DATA_SUBDIR "Library/Caches/GoldenPadRecompRT64"' "$out"
          grep -q 'std::getenv("HOME")) / GOLDENPAD_RT64_DATA_SUBDIR;' "$out"
          grep -q 'std::filesystem::create_directories(appConfig.dataPath, goldenpadFolderError);' "$out"
          grep -q 'RT64 runs without it\\n' "$out"
          if grep -q '"Library/Application Support/GoldenPadRecompRT64";' "$out"; then echo "::error::old path still there"; exit 1; fi
          [ "$(grep -c 'app = std::make_unique<RT64::Application>(appCore, appConfig);' "$out")" = 1 ]
          # the preamble itself must compile for Apple TV and pick Caches there
          sed -n 1,10p "$out" > "$RUNNER_TEMP/preamble.cpp"
          printf '%s\n' 'static_assert(sizeof(GOLDENPAD_RT64_DATA_SUBDIR) == sizeof("Library/Caches/GoldenPadRecompRT64"));' >> "$RUNNER_TEMP/preamble.cpp"
          xcrun --sdk appletvos clang++ -std=c++20 -target arm64-apple-tvos17.0 -fsyntax-only "$RUNNER_TEMP/preamble.cpp"
          echo "PASS: RT64 data folder fix"
      - name: Compile the Apple TV icon catalog
        run: |
          out="$RUNNER_TEMP/actool"; mkdir -p "$out"
          xcrun actool AssetsTV.xcassets --compile "$out" --platform appletvos \
            --minimum-deployment-target 17.0 --target-device tv --app-icon TVAppIcon \
            --output-partial-info-plist "$out/partial.plist" \
            --output-format human-readable-text --notices --warnings --errors
          ls -la "$out"
          plutil -p "$out/partial.plist"
